# LID3 sigmoid multi-label BCE config with AAM/sub-center cosine head.
#
# This mirrors LID1/LID2's classifier geometry as closely as possible while
# retaining LID3's multi-hot BCE target:
#   - same MMS/S3PRL + multilayer_feature frontend
#   - same ECAPA-TDNN + channel-attentive pooling + RawNet3 projector
#   - same AAM/sub-center hyperparameters as LID1/LID2
#   - positive BCE terms are reweighted by pos_weight=50
frontend: s3prl
frontend_conf:
  fs: 16000
  frontend_conf:
    upstream: hf_wav2vec2_custom
    path_or_url: facebook/mms-1b
  download_dir: ./hub
  multilayer_feature: true
normalize: utterance_mvn
normalize_conf:
  norm_vars: false
encoder: ecapa_tdnn
encoder_conf:
  model_scale: 8
  ndim: 512
  output_size: 1536
pooling: chn_attn_stat
projector: rawnet3
projector_conf:
  output_size: 192
preprocessor: lid_multilabel
preprocessor_conf:
  fix_duration: false
  sample_rate: 16000
  noise_apply_prob: 0.0
  rir_apply_prob: 0.0
model_conf:
  extract_feats_in_collect_stats: false
freeze_param: []
loss: arc_margin_subcenter_intertopk_multilabel_bce
loss_conf:
  threshold: 0.5
  pos_weight: 50
  margin: 0.5
  scale: 30
  K: 3
  mp: 0.06
  k_top: 5
num_att_plot: 0
num_workers: 8
cudnn_deterministic: false
cudnn_benchmark: true
log_interval: 100
unused_parameters: true
use_amp: true
keep_nbest_models: 2
grad_clip: 9999
best_model_criterion:
- - valid
  - accuracy
  - max
iterator_type: category
valid_iterator_type: category
seed: 3702
max_epoch: 30
accum_grad: 2
num_iters_per_epoch: 640
batch_type: catbel
drop_last_iter: true
optim: adam
optim_conf:
  lr: 5.0e-06
  betas:
  - 0.9
  - 0.98
scheduler: tristagelr
scheduler_conf:
  max_steps: 9600
  warmup_ratio: 0.1
  hold_ratio: 0.2
  decay_ratio: 0.7
  init_lr_scale: 0.6
  final_lr_scale: 0.1
batch_size: 16
valid_batch_size: 16
