# LID3 sigmoid multi-label BCE config.
#
# This mirrors lid1's unfrozen MMS+ECAPA setup:
#   - MMS/S3PRL frontend with multilayer_feature
#   - ECAPA-TDNN encoder
#   - channel-attentive statistics pooling
#   - RawNet3 projector with 192-dim embedding
#   - MMS is not frozen: freeze_param: []
#   - Adam lr=5e-6 and TriStageLR; run.sh rewrites the fixed 3-pass budget
#
# LID3-specific changes:
#   - preprocessor: lid_multilabel
#   - loss: multilabel_bce
#   - labels are read from utt2langs and converted to multi-hot vectors
frontend: s3prl
frontend_conf:
  fs: 16000
  frontend_conf:
    upstream: hf_wav2vec2_custom
    path_or_url: facebook/mms-1b
  download_dir: ./hub
  multilayer_feature: true
normalize: utterance_mvn
normalize_conf:
  norm_vars: false
encoder: ecapa_tdnn
encoder_conf:
  model_scale: 8
  ndim: 512
  output_size: 1536
pooling: chn_attn_stat
projector: rawnet3
projector_conf:
  output_size: 192
preprocessor: lid_multilabel
preprocessor_conf:
  fix_duration: false
  sample_rate: 16000
  noise_apply_prob: 0.0
  rir_apply_prob: 0.0
model_conf:
  extract_feats_in_collect_stats: false
freeze_param: []
loss: multilabel_bce
loss_conf:
  threshold: 0.5
num_att_plot: 0
num_workers: 8
cudnn_deterministic: false
cudnn_benchmark: true
log_interval: 100
unused_parameters: true
use_amp: true
keep_nbest_models: 2
grad_clip: 9999
best_model_criterion:
- - valid
  - accuracy
  - max
iterator_type: category
valid_iterator_type: category
seed: 3702
max_epoch: 30
accum_grad: 2
num_iters_per_epoch: 640
batch_type: catbel
drop_last_iter: true
optim: adam
optim_conf:
  lr: 5.0e-06
  betas:
  - 0.9
  - 0.98
scheduler: tristagelr
scheduler_conf:
  max_steps: 9600
  warmup_ratio: 0.1
  hold_ratio: 0.2
  decay_ratio: 0.7
  init_lr_scale: 0.6
  final_lr_scale: 0.1
batch_size: 16
valid_batch_size: 16
