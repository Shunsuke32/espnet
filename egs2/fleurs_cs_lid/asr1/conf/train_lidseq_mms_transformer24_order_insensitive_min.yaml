frontend: s3prl
frontend_conf:
  fs: 16k
  frontend_conf:
    upstream: hf_wav2vec2_custom
    path_or_url: facebook/mms-1b
  download_dir: ./hub
  multilayer_feature: true
normalize: utterance_mvn
normalize_conf:
  norm_vars: false
encoder: transformer
encoder_conf:
  output_size: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 24
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.0
  input_layer: linear
  normalize_before: true
decoder: transformer
decoder_conf:
  attention_heads: 4
  linear_units: 1024
  num_blocks: 4
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  self_attention_dropout_rate: 0.0
  src_attention_dropout_rate: 0.0
model_conf:
  extract_feats_in_collect_stats: false
  ctc_weight: 0.0
  lsm_weight: 0.1
  length_normalized_loss: false
  lidseq_order_insensitive_loss: true
  lidseq_order_insensitive_reduction: min
freeze_param:
- frontend.upstream
num_att_plot: 0
num_workers: 4
cudnn_deterministic: false
cudnn_benchmark: true
log_interval: 100
unused_parameters: true
use_amp: true
keep_nbest_models: 5
grad_clip: 5
best_model_criterion:
- - valid
  - loss
  - min
max_epoch: 30
num_iters_per_epoch: 640
batch_type: sorted
accum_grad: 4
optim: adam
optim_conf:
  lr: 0.001
  betas:
  - 0.9
  - 0.98
scheduler: warmuplr
scheduler_conf:
  warmup_steps: 960
batch_size: 8
valid_batch_size: 8
drop_last_iter: true
sort_in_batch: descending
sort_batch: descending
# Same model as train_lidseq_mms_transformer24.yaml, but the attention loss
# treats 2-token LID targets as unordered by taking the minimum loss over
# original and swapped label orders.
